# Render Blueprint — Mamed Kişisel Türkçe Yapay Zeka Sunucusu
services:
  - type: web
    name: mamed-server
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    dockerCommand: serve --host 0.0.0.0 --port 10000 --engine cloud --model gemini-3.5-flash
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: OPENJARVIS_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENJARVIS_CORS_ORIGINS
        sync: false
      - key: MAMED_TTS_BACKEND
        value: edge_tts
      - key: MAMED_TTS_VOICE
        value: tr-TR-AhmetNeural
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
